[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "evidence-inspector"
version = "0.1.0"
description = "Model Effectiveness Evaluation Workbench (Inspector engine) for ELEC5623."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "UNLICENSED - coursework" }
authors = [{ name = "Zhengyu Han" }]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "scikit-learn>=1.5,<2",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "hatchling==1.31.0",
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
]

[project.scripts]
evidence-inspector = "evidence_inspector.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/evidence_inspector"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["evidence_inspector"]

[tool.coverage.report]
fail_under = 80
show_missing = true
